<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>貴賓簽到系統</title>
<style>
:root{--bg:#f2f5f4;--fg:#14231f;--mut:#5d6b66;--card:#fff;--bd:#d3dcd8;--ac:#0f6b57;--acf:#fff;--l1:#c62828;--l2:#d97706;--ok:#15803d}
@media(prefers-color-scheme:dark){:root{--bg:#0f1715;--fg:#e6efec;--mut:#9aaba5;--card:#18221f;--bd:#2d3b37;--ac:#4fc3a1;--acf:#06201a;--l1:#ff6b6b;--l2:#f5a524;--ok:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
#app{max-width:880px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:.2em 0 .6em}h2{font-size:1.15rem;margin:1.4em 0 .5em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin:12px 0}
.c{text-align:center;margin-top:18vh}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
textarea{min-height:110px}
button{background:var(--ac);color:var(--acf);border:0;border-radius:8px;padding:12px 18px;cursor:pointer;font-weight:600}
button.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.d{background:transparent;color:var(--l1);border:1px solid var(--l1);padding:6px 10px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 140px}.row>button{flex:0 0 auto}
.mut{color:var(--mut);font-size:.9rem}
table{width:100%;border-collapse:collapse;font-size:.95rem}td,th{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left}
.wrap{overflow-x:auto}
.pick{display:block;width:100%;text-align:left;margin:8px 0;padding:18px;font-size:1.25rem;background:var(--card);color:var(--fg);border:1px solid var(--bd)}
.pick small{display:block;font-weight:400;color:var(--mut);font-size:.95rem}
.big{font-size:2rem;font-weight:700}
.tag{display:inline-block;color:#fff;border-radius:6px;padding:1px 10px;font-size:.85rem;font-weight:600}
.g1{border-left:8px solid var(--l1)}.g2{border-left:8px solid var(--l2)}.g3{border-left:8px solid var(--bd)}
.hc{display:flex;gap:12px;align-items:center;justify-content:space-between}
.hc .nm{font-size:1.6rem;font-weight:700}
.flash{animation:fl 1.6s ease-out 1}
@keyframes fl{from{background:var(--l2);transform:scale(1.02)}to{background:var(--card);transform:none}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ok);color:#fff;padding:12px 22px;border-radius:30px;font-weight:700;display:none}
@media(prefers-reduced-motion:reduce){.flash{animation:none}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" role="status"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== 部署前請修改這兩處 =====
const CONFIG={apiKey:"AIzaSyCpKnlFAsoZAM-TsxeDoDKy8YZ4-ToDMRI",authDomain:"peiying-exam-system.firebaseapp.com",projectId:"peiying-exam-system",appId:"1:956026097502:web:6d82bbc16533abb888c9cf"};
const DOMAIN="tmail.hc.edu.tw"; // 學校 Google 網域(@ 後面的部分)
// =============================
firebase.initializeApp(CONFIG);
const auth=firebase.auth(),db=firebase.firestore(),TS=firebase.firestore.Timestamp,SV=firebase.firestore.FieldValue.serverTimestamp;
const Q=new URLSearchParams(location.search),E=Q.get('e'),$=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LV={1:['特別貴賓','var(--l1)'],2:['重要來賓','var(--l2)'],3:['一般來賓','var(--bd)']};
const tag=l=>l<3?`<span class="tag" style="background:${LV[l][1]}">${LV[l][0]}</span>`:'';
const after30=d=>TS.fromMillis((d?new Date(d+'T23:59:59').getTime():Date.now())+30*864e5);
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1800)};
const ev=()=>db.collection('events').doc(E),gs=()=>ev().collection('guests'),fs=()=>ev().collection('flags');
const rnd=()=>[...crypto.getRandomValues(new Uint8Array(18))].map(b=>b.toString(16).padStart(2,'0')).join('');
const base=location.origin+location.pathname;

auth.onAuthStateChanged(u=>{
  if(Q.get('h')) return u?host(u):auth.signInAnonymously().catch(()=>app.innerHTML='<p class="c">無法開啟主持人面板</p>');
  if(!u||u.isAnonymous) return login();
  if(!u.email.endsWith('@'+DOMAIN)){alert('僅限學校 Google 帳號使用');return auth.signOut()}
  E&&Q.get('m')==='desk'?desk():E?evView(u):evList(u);
});
function login(){
  app.innerHTML='<div class="card c"><h1>貴賓簽到系統</h1><p class="mut">請使用學校 Google 帳號登入</p><button id="lg">使用 Google 登入</button></div>';
  $('#lg').onclick=()=>{const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({hd:DOMAIN});auth.signInWithPopup(p).catch(e=>toast('登入失敗:'+e.code))};
}

/* ---------- 承辦人:活動列表 ---------- */
async function evList(u){
  const s=await db.collection('events').where('owner','==',u.uid).get();
  const l=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.date.localeCompare(a.date));
  app.innerHTML=`<div class="hc"><h1>我的活動</h1><button class="g" id="lo">登出</button></div>
  <div class="card"><h2 style="margin-top:0">建立活動</h2><div class="row"><input id="n" placeholder="活動名稱"><input id="d" type="date"><button id="mk">建立活動</button></div></div>
  ${l.map(e=>`<a class="card" style="display:block;color:inherit;text-decoration:none" href="?e=${e.id}"><b>${esc(e.name)}</b><div class="mut">${esc(e.date)}</div></a>`).join('')||'<p class="mut">還沒有活動。先建立一個吧。</p>'}`;
  $('#lo').onclick=()=>auth.signOut();
  $('#mk').onclick=async()=>{const name=$('#n').value.trim(),date=$('#d').value;if(!name||!date)return toast('請填活動名稱與日期');
    const r=await db.collection('events').add({name,date,owner:u.uid,email:u.email,hostToken:rnd(),expireAt:after30(date)});location.search='?e='+r.id};
}

/* ---------- 承辦人:活動管理 ---------- */
async function evView(u){
  const es=await ev().get();if(!es.exists||es.data().owner!==u.uid){app.innerHTML='<p class="c">找不到此活動,或你不是承辦人。<br><a href="./">回活動列表</a></p>';return}
  const e=es.data();let G=[],F={};
  const deskUrl=`${base}?e=${E}&m=desk&n=${encodeURIComponent(e.name)}`,hostUrl=`${base}?e=${E}&h=${e.hostToken}`;
  app.innerHTML=`<a href="./">← 活動列表</a><h1>${esc(e.name)}</h1><div class="mut">${esc(e.date)}・已簽到 <b id="cnt">0</b> / <span id="tot">0</span></div>
  <div class="card"><h2 style="margin-top:0">連結</h2>
   <p class="mut">簽到連結給現場工作人員(iPad)。主持人連結只給主持人,請勿投影或公開。</p>
   <div class="row"><button class="g" id="c1">複製簽到連結</button><button class="g" id="c2">複製主持人連結</button><button class="d" id="rs">重設主持人連結</button></div></div>
  <div class="card"><h2 style="margin-top:0">匯入來賓名單</h2>
   <p class="mut">每行一位:姓名,單位,職稱,等級(1 特別貴賓/2 重要來賓/3 一般,可省略),提示文字(可省略)。可直接從 Excel 貼上。</p>
   <textarea id="im" placeholder="王大明,教育局,局長,1,請介紹並邀請致詞"></textarea><p><button id="go">匯入</button></p></div>
  <h2>來賓名單</h2><div class="wrap"><table><thead><tr><th>姓名</th><th>單位/職稱</th><th>等級</th><th>提示文字</th><th>簽到</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
  <p><button class="g" id="ex">匯出已簽到名單(CSV)</button></p>`;
  const cp=(t)=>navigator.clipboard.writeText(t).then(()=>toast('已複製'));
  $('#c1').onclick=()=>cp(deskUrl);$('#c2').onclick=()=>cp(hostUrl);
  $('#rs').onclick=async()=>{if(confirm('重設後,舊的主持人連結立即失效。確定嗎?')){await ev().update({hostToken:rnd()});location.reload()}};
  $('#go').onclick=async()=>{
    const rows=$('#im').value.split('\n').map(r=>r.split(/[,\t,]/).map(x=>x.trim())).filter(r=>r[0]);
    for(let i=0;i<rows.length;i+=200){const b=db.batch();
      rows.slice(i,i+200).forEach(r=>{const g=gs().doc(),x=after30(e.date);
        b.set(g,{name:r[0],unit:r[1]||'',title:r[2]||'',checkedIn:false,introduced:false,source:'import',expireAt:x});
        b.set(fs().doc(g.id),{level:[1,2,3].includes(+r[3])?+r[3]:3,note:r[4]||'',expireAt:x})});
      await b.commit()}
    $('#im').value='';toast(`已匯入 ${rows.length} 位`)};
  const draw=()=>{
    $('#tot').textContent=G.length;$('#cnt').textContent=G.filter(g=>g.checkedIn).length;
    G.sort((a,b)=>(F[a.id]?.level||3)-(F[b.id]?.level||3)||a.name.localeCompare(b.name));
    $('#tb').innerHTML=G.map(g=>{const f=F[g.id]||{level:3,note:''};
      return`<tr><td><b>${esc(g.name)}</b></td><td>${esc(g.unit)}<div class="mut">${esc(g.title)}</div></td>
      <td><select data-l="${g.id}">${[1,2,3].map(n=>`<option value="${n}"${f.level==n?' selected':''}>${LV[n][0]}</option>`).join('')}</select></td>
      <td><input data-n="${g.id}" value="${esc(f.note)}"></td><td>${g.checkedIn?'✓':''}</td><td><button class="d" data-x="${g.id}">刪除</button></td></tr>`}).join('')};
  gs().onSnapshot(s=>{G=s.docs.map(d=>({id:d.id,...d.data()}));draw()});
  fs().onSnapshot(s=>{F={};s.forEach(d=>F[d.id]=d.data());draw()});
  $('#tb').onchange=ev_=>{const t=ev_.target,id=t.dataset.l||t.dataset.n;if(!id)return;
    fs().doc(id).set(t.dataset.l?{level:+t.value}:{note:t.value},{merge:true})};
  $('#tb').onclick=async ev_=>{const id=ev_.target.dataset.x;if(id&&confirm('刪除這位來賓?')){await gs().doc(id).delete();await fs().doc(id).delete()}};
  $('#ex').onclick=()=>{const L=G.filter(g=>g.checkedIn).sort((a,b)=>(a.checkedAt?.toMillis()||0)-(b.checkedAt?.toMillis()||0));
    const t=['姓名,單位,職稱,簽到時間',...L.map(g=>[g.name,g.unit,g.title,g.checkedAt?g.checkedAt.toDate().toLocaleString('zh-TW'):''].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(','))].join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download=e.name+'-簽到名單.csv';a.click()};
}

/* ---------- 櫃檯簽到(iPad) ---------- */
function desk(){
  let G=[];const title=Q.get('n')||'貴賓簽到';
  app.innerHTML=`<div class="hc"><h1>${esc(title)}</h1><div class="mut">已簽到 <span class="big" id="cnt">0</span></div></div>
  <input id="q" placeholder="輸入姓名搜尋" autocomplete="off" style="font-size:1.4rem;padding:16px">
  <div id="rs"></div>
  <details class="card"><summary><b>名單上找不到?現場新增</b></summary><div class="row" style="margin-top:12px"><input id="wn" placeholder="姓名"><input id="wu" placeholder="單位"><input id="wt" placeholder="職稱"><button id="wa">新增並簽到</button></div></details>`;
  const q=$('#q'),draw=()=>{const k=q.value.trim();
    $('#cnt').textContent=G.filter(g=>g.checkedIn).length;
    $('#rs').innerHTML=k?(G.filter(g=>g.name.includes(k)).slice(0,8).map(g=>`<button class="pick" data-i="${g.id}"${g.checkedIn?' disabled':''}>${esc(g.name)}${g.checkedIn?' (已簽到)':''}<small>${esc(g.unit)} ${esc(g.title)}</small></button>`).join('')||'<p class="mut">名單中沒有這個名字,可用下方「現場新增」。</p>'):'<p class="mut">輸入姓名的任一字,點選正確的來賓即可簽到。</p>'};
  gs().onSnapshot(s=>{G=s.docs.map(d=>({id:d.id,...d.data()}));draw()},()=>app.innerHTML='<p class="c">沒有權限或活動不存在</p>');
  q.oninput=draw;
  $('#rs').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const g=G.find(x=>x.id===b.dataset.i);
    await gs().doc(g.id).update({checkedIn:true,checkedAt:SV(),checkedBy:auth.currentUser.email});toast('已簽到:'+g.name);q.value='';draw();q.focus()};
  $('#wa').onclick=async()=>{const name=$('#wn').value.trim();if(!name)return toast('請輸入姓名');
    await gs().add({name,unit:$('#wu').value.trim(),title:$('#wt').value.trim(),checkedIn:true,introduced:false,checkedAt:SV(),checkedBy:auth.currentUser.email,source:'walkin',expireAt:after30()});
    toast('已簽到:'+name);['#wn','#wu','#wt'].forEach(s=>$(s).value='');q.focus()};
  q.focus();
}

/* ---------- 主持人面板 ---------- */
async function host(u){
  await db.doc(`events/${E}/hosts/${u.uid}`).set({token:Q.get('h')}).catch(()=>{});
  let G={},F={},seen=null;const L={};
  const draw=()=>{
    const all=Object.entries(G).map(([id,g])=>({id,...g,f:F[id]||{level:3,note:''}}));
    const ms=x=>x.checkedAt?.toMillis?.()||Date.now(),srt=(a,b)=>a.f.level-b.f.level||ms(b)-ms(a);
    const card=(g,fl)=>`<div class="card g${g.f.level}${fl?' flash':''}"><div class="hc"><div><div class="nm">${esc(g.name)} ${tag(g.f.level)}</div><div>${esc(g.unit)} ${esc(g.title)}</div>${g.f.note?`<div style="margin-top:6px;font-weight:600">${esc(g.f.note)}</div>`:''}</div>
      <button class="${g.introduced?'g':''}" data-i="${g.id}" data-v="${!g.introduced}">${g.introduced?'還原':'已介紹'}</button></div></div>`;
    const todo=all.filter(g=>!g.introduced).sort(srt),done=all.filter(g=>g.introduced).sort(srt);
    app.innerHTML=`<h1>主持人面板</h1><p class="mut">已到場 ${all.length} 位・待介紹 ${todo.length} 位</p>${todo.map(g=>card(g,seen&&!seen.has(g.id)&&F[g.id]&&g.f.level<3)).join('')||'<p class="mut">目前沒有待介紹的來賓。</p>'}
    ${done.length?`<h2>已介紹</h2>${done.map(g=>card(g)).join('')}`:''}`;
    all.forEach(g=>{if(F[g.id])seen.add(g.id)});
  };
  app.onclick=e=>{const b=e.target.closest('button[data-i]');if(b)gs().doc(b.dataset.i).update({introduced:b.dataset.v==='true'})};
  gs().where('checkedIn','==',true).onSnapshot(s=>{
    G={};s.forEach(d=>G[d.id]=d.data());
    Object.keys(G).forEach(id=>{if(!L[id])L[id]=fs().doc(id).onSnapshot(f=>{F[id]=f.data()||{level:3,note:''};draw()},()=>{})});
    if(!seen)seen=new Set(Object.keys(G));draw()},()=>app.innerHTML='<p class="c">連結無效、已被重設,或活動不存在</p>');
}
</script>
</body>
</html>
